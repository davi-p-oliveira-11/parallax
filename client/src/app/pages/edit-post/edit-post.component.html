<app-header />
<form class="w-[50%] h-screen flex flex-col m-auto items-center justify-center gap-3">
   <textarea
    type="text"
    name="title"
    rows="5"
    class="custom-input w-[100%] px-3"
    placeholder="type your title here ... "
   ></textarea>   
   <textarea
     type="text"
     name="content"
     rows="10"
     class="custom-input w-[100%] px-3"
     placeholder="type your desc here"
   ></textarea>
   <input type="file" name="cover" class="self-start" />
   <button type="submit" class="bg-slate-600 rounded-lg p-5 w-60 text-white">Submit</button>
</form>
