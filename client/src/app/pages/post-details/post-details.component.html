<app-header />
@if (postDetails) {
<div class="flex flex-col w-[50%] m-auto mt-6 gap-6 items-start">
  <div class="font-bold"> {{ postDetails.title }}</div>
  <div class="w-full m-auto relative h-96">
     <img [ngSrc]="postDetails.img" fill class="aspect-square object-cover" /> 
  </div>
  <div class="mb-10">{{ postDetails.desc }}</div>
</div>
} @else {
  <h1> {{ error }}</h1>    
}
